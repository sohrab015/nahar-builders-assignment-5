<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects | Nahar Builders</title>
  <!-- heat/taitle logo -->
    <link rel="icon" href="assets/heatTitleLogo.png" type="image/png">
  <meta name="description" content="All completed, ongoing and infrastructure projects by Nahar Builders in Chattogram and across Bangladesh.">

  <!-- Google Font + Google Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">

  <!-- DaisyUI + Tailwind + SweetAlert -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.23/dist/full.min.css" rel="stylesheet" type="text/css">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="tailwind.config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
  <link rel="stylesheet" href="styls/style.css">
</head>

<body class="font-body text-slate-800" data-page="projects.html">

  <div id="navbar"></div>

  <section class="bg-ink text-white py-16">
    <div class="max-w-6xl mx-auto px-4">
      <h1 class="font-head font-extrabold text-4xl md:text-5xl mb-3">Landmarks & developments</h1>
      <p class="text-lg text-slate-300 max-w-2xl">Residential towers, hospitality, commercial markets and infrastructure contributions across Bangladesh.</p>
    </div>
  </section>

  <main>
    <section class="py-16">
      <div class="max-w-6xl mx-auto px-4">
        <div class="flex flex-wrap gap-2 mb-8" role="group" aria-label="Filter projects">
          <button data-filter="all" class="filter-btn btn btn-sm rounded-full bg-ink text-white">All projects</button>
          <button data-filter="Completed" class="filter-btn btn btn-sm rounded-full btn-outline">Completed</button>
          <button data-filter="Ongoing" class="filter-btn btn btn-sm rounded-full btn-outline">Ongoing</button>
          <button data-filter="Infrastructure" class="filter-btn btn btn-sm rounded-full btn-outline">Infrastructure &amp; resort</button>
        </div>
        <div id="projectGrid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <!-- Project details modal (DaisyUI) -->
  <dialog id="projectModal" class="modal modal-bottom sm:modal-middle">
    <div class="modal-box p-0 max-w-2xl">
      <form method="dialog"><button class="btn btn-sm btn-circle absolute right-3 top-3 z-10" aria-label="Close">✕</button></form>
      <div id="modalImg" class="aspect-video bg-gradient-to-br from-steel to-ink2"></div>
      <div class="p-6">
        <span id="modalStatus" class="badge badge-neutral mb-2"></span>
        <h3 id="modalTitle" class="font-head font-bold text-2xl"></h3>
        <p id="modalType" class="text-slate-500 mb-3"></p>
        <p id="modalDesc" class="mb-4"></p>
        <div id="modalFacts" class="grid grid-cols-2 sm:grid-cols-3 gap-4 mb-5"></div>
        <div class="flex flex-wrap gap-2">
          <span id="modalPageLink"></span>
          <a href="contact.html" class="btn btn-sm btn-outline">Ask about a similar project</a>
        </div>
      </div>
    </div>
    <form method="dialog" class="modal-backdrop"><button>close</button></form>
  </dialog>

  <div id="footer"></div>

  <script src="js/data.js"></script>
  <script src="js/components.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/projects.js"></script>
</body>

</html>
